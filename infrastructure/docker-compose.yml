version: '3.8'

services:
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper-worker
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  #Kafka donde se publicaran los mensajes de los pedidos
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka-worker
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    depends_on:
      - zookeeper #Kafka no inicia hasta que zookeeper este listo
    
  #MongoDb
  mongodb:
    image: mongo:latest
    container_name: mongodb-worker
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  
  #Gestion de estado y bloqueos (redis)
  redis:
    image: redis:latest
    container_name: redis-worker
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  
#Aqui simplemente se listan para que docker sepa que existen
volumes:
  mongo_data:
  redis_data: