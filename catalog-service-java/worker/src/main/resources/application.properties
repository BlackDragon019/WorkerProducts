spring.application.name=worker

#kafka
spring.kafka.bootstrap-servers=kafka-worker:9092
spring.kafka.consumer.auto-offset-reset=earliest

#Mongo
spring.mongodb.uri=mongodb://mongodb-worker:27017/orders_db

# Redis (docker service)
spring.redis.host=redis
spring.redis.port=6379
# Also set Spring Data Redis properties to avoid defaults
spring.data.redis.host=redis
spring.data.redis.port=6379

# Catalog API (Go)
catalog.api.url=http://catalog-go:8081/api/v1

# Order retry / failed messages
order.max-retries=5
order.failed-ttl-seconds=86400

# Debug logging for worker
logging.level.com.worker.orderworker=DEBUG